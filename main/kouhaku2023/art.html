<!DOCTYPE html>
<html lang="ja">
  <head>
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- 自動暗転の拒否。Androidのアプリ内ブラウザ（X等）は白背景を勝手に黒へ反転させる。
         "light" だけでは「ダーク非対応」と解釈され止まらない。拒否には only が要る（実測で確認・2026-08-29） -->
    <meta name="color-scheme" content="only light">
    <!-- Favicon -->
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/lity/1.6.6/lity.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lity/1.6.6/lity.js"></script>
    <!-- Google Font CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Noto+Sans+JP"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap"
      rel="stylesheet"
    />
    <!-- キャッシュさせない -->
    <meta http-equiv="Pragma" content="no-store" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>NFT紅白2023</title>
    <!-- css -->
    <link rel="stylesheet" href="static/common.css" />
    <link rel="stylesheet" href="static/navi.css" />
    <link rel="stylesheet" href="static/animation.css" />
  </head>
  <body>
    <!-- ローディング画面 -->
    <div id="splash">
      <div id="splash_text">
        <img src="image/loading-image.png" alt="移動する画像" class="lord" />
      </div>
      <div class="loader_cover loader_cover-up"></div>
      <div class="loader_cover loader_cover-down"></div>
    </div>
    <div id="navi"></div>
    <div class="wrap-header white-font brown-bg">作品一覧</div>
    <section class="white-bg lp-space20">
      <div class="wrap-content lp-space40">
        <h2 class="lp-space10">NFT紅白作品一覧</h2>
        <div class="orange-bg height-box60 short-middle-box">
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSckqkngzyIQ_9eiDV13ipL4xjZ2Hw0kGqNrc-XeXqESc2TUUA/viewform" class="white-font">掲載申請はこちら</a>
        </div>
          <br>
        <div class="black-bg height-box60 short-middle-box">
          <a href="leader.html" class="white-font">代表戦作品一覧</a>
        </div>
        <div class="lp-space10">ランダム50件順不同</div>
        <div class="lp-space10">画像を選択すると詳細が表示されます</div>
      </div>
      <div class="wrap-content lp-space10">
        <div id="list-art" class="middle-box all-box wrap-artbox"></div>
      </div>
    </section>
    <div id="footer"></div>
    <div id="modalArtArea" class="modalNoDisp">
      <div class="modalWindow art-modalWindow">
        <div class="modal-art-detail">
          <div class="lp-art-close">
            <a href="#" onclick="modalClose('modalArtArea');return false;">
              <img src="image/icon_close.png" />
            </a>
          </div>
          <div class="modal-art-content beige-bg">
            <div class="artname"></div>
            <div class="creatorname"></div>
            <div class="artimage"></div>
            <h3>販売情報</h3>
            <div class="platform"></div>
            <div class="saleinfo"></div>
            <div class="artpost"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <!--ロード画面用-->
  <script src="https://cdn.jsdelivr.net/npm/progressbar.js@1.1.1/dist/progressbar.min.js"></script>
  <!-- JS -->
  <script src="static/common.js"></script>
  <script src="static/art.js"></script>
  <script>
    $(".navbar-nav>li>a , .dropdown-menu>a").on("click", function () {
      if (this.id != "navbarNav") {
        $(".navbar-collapse").collapse("hide");
      }
    });
  </script>
</html>
