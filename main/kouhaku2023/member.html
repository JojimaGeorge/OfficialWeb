<!DOCTYPE html>
<html lang="ja">
  <head>
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Favicon -->
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/lity/1.6.6/lity.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lity/1.6.6/lity.js"></script>
    <!-- Google Font CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Noto+Sans+JP"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap"
      rel="stylesheet"
    />
    <!-- キャッシュさせない -->
    <meta http-equiv="Pragma" content="no-store" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>NFT紅白2023</title>
    <!-- css -->
    <link rel="stylesheet" href="static/common.css" />
    <link rel="stylesheet" href="static/navi.css" />
    <link rel="stylesheet" href="static/animation.css" />
  </head>
  <body>
    <!-- ローディング画面 -->
    <div id="splash">
      <div id="splash_text">
        <img src="image/loading-image.png" alt="移動する画像" class="lord" />
      </div>
      <div class="loader_cover loader_cover-up"></div>
      <div class="loader_cover loader_cover-down"></div>
    </div>
    <div id="navi"></div>
    <div class="wrap-header white-font brown-bg">参加者一覧</div>
    <section class="white-bg lp-space20">
       <!--<h2 class="red-bg long-box lp-space40">
        <a href="leader.html">代表戦メンバー</a>
      </h2>-->
      <div class="container animation-element">
        <div class="wrap-content lp-space40">
          <div class="lp-space10">NFT紅白参加者一覧</div>
          <div class="lp-space10">五十音順敬称略</div>
        </div>
        <div class="wrap-content lp-space10">
          <div class="orange-bg white-font middle-box all-box">
            <a href="#creator" class="white-font">クリエイターの部</a>
          </div>
        </div>
        <div class="wrap-content lp-space10">
          <div class="orange-bg middle-box all-box">
            <a href="#collector" class="white-font">コレクターの部</a>
          </div>
        </div>
      </div>
      <div class="container lp-space60 animation-element" id="creator">
        <div class="wrap-content lp-space10">クリエイターの部</div>
        <div class="wrap-content wrap-split">
          <div class="wrap-content wrap-split-harf">
            <div class="white-font red-bg max-box">紅組</div>
            <div id="list-creator-red">
              <div>
                <a
                  href="https://twitter.com/akyuuuu49"
                  class="red-font member-name"
                  >あきゅー（初）</a
                >
              </div>
              <div>
                <a
                  href="https://twitter.com/OKASHI_NAKO_"
                  class="red-font member-name"
                  >おかし🍬なこ（２）</a
                >
              </div>
            </div>
          </div>
          <div class="wrap-content wrap-split-harf">
            <div class="white-font brown-bg max-box">白組</div>
            <div id="list-creator-white">
              <div>
                <a
                  href="https://twitter.com/tosawin"
                  class="brown-font member-name"
                  >アクロス（２）</a
                >
              </div>
              <div>
                <a
                  href="https://twitter.com/mirakuru_NFT2"
                  class="brown-font member-name"
                  >みらくる☆桃香（２）</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="container lp-space60 animation-element" id="collector">
        <div class="wrap-content lp-space10">コレクターの部</div>
        <div class="wrap-content wrap-split">
          <div class="wrap-content wrap-split-harf">
            <div class="white-font red-bg max-box">紅組</div>
            <div id="list-collector-red"></div>
          </div>
          <div class="wrap-content wrap-split-harf">
            <div class="white-font brown-bg max-box">白組</div>
            <div id="list-collector-white"></div>
          </div>
        </div>
      </div>
    </section>
    <div id="footer"></div>
  </body>
  <!--ロード画面用-->
  <script src="https://cdn.jsdelivr.net/npm/progressbar.js@1.1.1/dist/progressbar.min.js"></script>
  <!-- JS -->
  <script src="static/common.js"></script>
  <script src="static/member.js"></script>
  <script>
    $(".navbar-nav>li>a , .dropdown-menu>a").on("click", function () {
      if (this.id != "navbarNav") {
        $(".navbar-collapse").collapse("hide");
      }
    });
  </script>
</html>
