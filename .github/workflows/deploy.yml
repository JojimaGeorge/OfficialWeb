name: Deploy to Lollipop

# 2026-06-21: Vercel へ移行したため自動デプロイを無効化。
# Lolipop は解約予定。手動実行のみ残す（解約までの安全網）。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 ssh.lolipop.jp >> ~/.ssh/known_hosts 2>/dev/null
          # Verify key is readable
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Deploy main site (jojima-george.com)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 2222" \
            ./main/ \
            ${{ secrets.SSH_USER }}@ssh.lolipop.jp:${{ secrets.DEPLOY_PATH }}/main/

      - name: Deploy sushi-daruma site
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 2222" \
            ./sushi-daruma/ \
            ${{ secrets.SSH_USER }}@ssh.lolipop.jp:${{ secrets.DEPLOY_PATH }}/sushi-daruma/
