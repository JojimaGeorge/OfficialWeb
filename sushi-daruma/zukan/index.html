<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>すしだるま図鑑</title>
    <meta name="theme-color" content="#FFED4D">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link href="https://fonts.googleapis.com/css?family=M+PLUS+Rounded+1c" rel="stylesheet">
    <style>
        @charset "utf-8";
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        body {
            font-family: "M PLUS Rounded 1c", "メイリオ", "Meiryo, Osaka", "ＭＳ Ｐゴシック", "MS P Gothic", "sans-serif";
            background-color: #FFED4D;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* 動くドット背景 */
        .movingdot {
            z-index: 0;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            pointer-events: none;
            background-color: rgba(255,255,255,0.00);
            background-image: radial-gradient(circle, rgba(255,255,255,0.54) 20%, transparent 20%);
            background-size: 10px 10px;
            animation: moveDots 50s linear infinite;
        }
        
        @keyframes moveDots {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }
        
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        /* ロゴ（左上） */
        .logo-section {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        
        .logo {
            height: 50px;
        }
        
        /* タイトル（中央） */
        .title-section {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 80px;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #555050;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        /* 言語切り替えボタン（右上） */
        .language-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .lang-btn {
            background-color: rgba(255,255,255,0.8);
            border: 2px solid #FC7500;
            border-radius: 25px;
            padding: 8px 16px;
            margin: 0 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lang-btn.active {
            background-color: #FC7500;
            color: white;
        }
        
        .lang-btn:hover {
            transform: scale(1.05);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* スライドショーコンテナ（元HPスタイル完全準拠） */
        .slider-container {
            position: relative;
            width: 94%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* HPのスライダー矢印スタイル流用 */
        .slider-arrow {
            position: absolute;
            top: 50%;
            cursor: pointer;
            outline: none;
            border-top: 2px solid #666;
            border-right: 2px solid #666;
            height: 15px;
            width: 15px;
            z-index: 20;
            transition: all 0.3s ease;
        }
        
        .slider-arrow:hover {
            border-color: #FC7500;
        }
        
        .arrow-left:hover {
            transform: rotate(-135deg) scale(1.2);
            border-color: #FC7500;
        }
        
        .arrow-right:hover {
            transform: rotate(45deg) scale(1.2);
            border-color: #FC7500;
        }
        
        .arrow-left {
            left: -1.5%;
            transform: rotate(-135deg);
        }
        
        .arrow-right {
            right: -1.5%;
            transform: rotate(45deg);
        }
        
        /* 3エリア構成 */
        .side-area {
            width: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .main-area {
            width: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* サイドのすしだるま（元HPスタイル準拠） */
        .side-daruma {
            width: 300px;
            height: 300px;
            transform: scale(0.8);
            opacity: 0.5;
            transition: all 0.5s ease;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .side-daruma:hover {
            opacity: 0.7;
            transform: scale(0.85);
        }
        
        .side-daruma img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* メインのすしだるまカード（サイズ拡大） */
        .zukan-card {
            background-color: rgba(255,255,255,0.7);
            border-radius: 10px;
            padding: 40px 30px 30px 30px;
            text-align: center;
            width: 700px;
            height: 800px;
            min-height: 800px;
            max-height: 800px;
            position: relative;
            transition: opacity 0.3s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .daruma-number {
            position: absolute;
            top: 15px;
            right: 20px;
            background: orange;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        .daruma-image {
            width: 450px;
            height: 450px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        
        .daruma-gif {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .daruma-info {
            height: 250px;
            min-height: 250px;
            max-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        
        .daruma-info h2 {
            font-size: 2rem;
            font-weight: bold;
            color: #555050;
            margin-bottom: 15px;
            animation: rainbow 5s infinite;
        }
        
        @keyframes rainbow {
            0% { color: #00CED1; }
            20% { color: #00BFFF; }
            40% { color: #4169E1; }
            60% { color: #8A2BE2; }
            80% { color: #9932CC; }
            100% { color: #00CED1; }
        }
        
        .daruma-description {
            font-size: 1rem;
            color: #555050;
            line-height: 1.6;
            font-weight: bold;
            max-width: 600px;
            height: 150px;
            margin: 0 auto;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 8;
            -webkit-box-orient: vertical;
            text-overflow: ellipsis;
        }
        
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 0 0 10px 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #FC7500;
            width: 0%;
            animation: progress 7s linear infinite;
        }
        
        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            position: relative;
            z-index: 100;
        }
        
        .creator-info {
            font-size: 0.8rem;
            color: #555050;
            font-weight: bold;
        }
        
        /* すしだるま診断ボタン（右下固定） */
        .shindan-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            padding: 15px 25px;
            border: none;
            border-radius: 30px;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background: linear-gradient(45deg, #1E40AF, #3B82F6, #06B6D4, #38BDF8);
            background-size: 300% 300%;
            animation: gradientShift 5s ease infinite;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        
        .shindan-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            animation: gradientShift 2.5s ease infinite;
        }
        
        .shindan-button:active {
            transform: translateY(-1px);
        }
        
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        /* iPad Pro 12.9インチ横向け最適化 */
        @media screen and (max-width: 2732px) and (orientation: landscape) {
            .title {
                font-size: 3rem;
            }
            
            .daruma-image {
                width: 500px;
                height: 500px;
            }
            
            .daruma-info h2 {
                font-size: 2.5rem;
            }
            
            .daruma-description {
                font-size: 1.1rem;
            }
            
            .side-daruma {
                width: 350px;
                height: 350px;
            }
            
            .zukan-card {
                height: 800px;
            }
        }
        
        /* タブレットサイズ */
        @media (max-width: 1200px) {
            .title {
                font-size: 2rem;
            }
            
            .daruma-image {
                width: 350px;
                height: 350px;
            }
            
            .daruma-info h2 {
                font-size: 1.8rem;
            }
            
            .daruma-description {
                font-size: 0.9rem;
            }
            
            .side-daruma {
                width: 200px;
                height: 200px;
            }
            
            .zukan-card {
                height: 650px;
            }
            
            /* タブレットでの診断ボタン調整 */
            .shindan-button {
                bottom: 18px;
                right: 18px;
                padding: 13px 22px;
                font-size: 15px;
            }
        }
        
        /* スマホサイズ */
        @media screen and (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .title-section {
                margin-top: 60px;
                margin-bottom: 20px;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .logo {
                height: 40px;
            }
            
            .language-toggle {
                top: 10px;
                right: 10px;
            }
            
            .lang-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .daruma-image {
                width: 280px;
                height: 280px;
            }
            
            .daruma-info h2 {
                font-size: 1.6rem;
            }
            
            .daruma-description {
                font-size: 0.8rem;
                padding: 0 10px;
            }
            
            .zukan-card {
                width: 95%;
                padding: 30px 20px 20px 20px;
                height: 550px;
            }
            
            .side-area {
                display: none;
            }
            
            .main-area {
                width: 100%;
            }
            
            .arrow-left {
                left: 1%;
            }
            
            .arrow-right {
                right: 1%;
            }
            
            /* スマホでの診断ボタン調整 */
            .shindan-button {
                bottom: 15px;
                right: 15px;
                padding: 12px 20px;
                font-size: 14px;
            }
        }
        
        .loading {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- 動くドット背景 -->
    <section class="movingdot"></section>
    
    <!-- ロゴ（左上） -->
    <div class="logo-section">
        <img src="../image/logo_zukan.png" alt="すしだるまロゴ" class="logo">
    </div>
    
    <!-- 言語切り替えボタン（右上） -->
    <div class="language-toggle">
        <button class="lang-btn active" onclick="switchLanguage('ja')" id="btn-ja">日本語</button>
        <button class="lang-btn" onclick="switchLanguage('en')" id="btn-en">English</button>
    </div>
    
    <div class="container">

        <div class="main-content">
            <div class="slider-container">
                <!-- HPスタイルの矢印（左） -->
                <div class="slider-arrow arrow-left" onclick="previousDaruma()"></div>
                
                <!-- 左エリア -->
                <div class="side-area">
                    <div class="side-daruma" onclick="previousDaruma()">
                        <img id="side-left-img" src="../image/ba-ba.webp" alt="前のすしだるま">
                    </div>
                </div>
                
                <!-- 中央エリア -->
                <div class="main-area">
                    <div class="zukan-card loading">
                        <div class="daruma-number" id="daruma-number">No. 1</div>
                        <div class="daruma-image">
                            <img class="daruma-gif" id="daruma-gif" src="../image/maguro.webp" alt="すしだるま">
                        </div>
                        <div class="daruma-info">
                            <h2 id="daruma-name">まぐろ</h2>
                            <p class="daruma-description" id="daruma-description">お寿司屋さんに入って最初に注文するのはこの一品。シンプルな見た目とは引き換えに、奥深い旨味を楽しめます。飽きのこないバランスの良さで、思わずリピートすること必須です。</p>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" id="progress-bar"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 右エリア -->
                <div class="side-area">
                    <div class="side-daruma" onclick="nextDaruma()">
                        <img id="side-right-img" src="../image/salmon.webp" alt="次のすしだるま">
                    </div>
                </div>
                
                <!-- HPスタイルの矢印（右） -->
                <div class="slider-arrow arrow-right" onclick="nextDaruma()"></div>
            </div>
        </div>
        
        <div class="footer">
            <p class="creator-info" id="footer-info">Created by 城島ジョージ | すしだるま公式 | https://sushi-daruma.com/</p>
        </div>
    </div>
    
    <!-- すしだるま診断ボタン -->
    <a href="https://sushi-daruma.com/shindan/" target="_blank" class="shindan-button">
        すしだるま診断
    </a>

        let currentLanguage = 'ja';
        let currentIndex = 0;
        let autoSlideInterval;
        
        // 多言語対応のテキスト
        const uiTexts = {
            ja: {

                footer: "Created by 城島ジョージ | すしだるま公式 | https://sushi-daruma.com/"

            en: {
                title: "Sushi Daruma Encyclopedia",

        };
        
        // すしだるまのデータ（31種類・日英対応）
        const sushiDarumaData = [
            {
                name: { ja: "まぐろ", en: "Maguro" },
                description: {
                    ja: "お寿司屋さんに入って最初に注文するのはこの一品。シンプルな見た目とは引き換えに、奥深い旨味を楽しめます。飽きのこないバランスの良さで、思わずリピートすること必須です。",
                    en: "This is one of the first sushi you order when you enter a sushi restaurant. In exchange for its simple appearance, you can enjoy its deep flavor. It is a well-balanced dish that you will never get tired of, and you will find yourself repeating it."

                    en: "Worthy of being called the idol of the sushi world, it has a look and taste that appeals to men and women of all ages. No matter the season, the rich fatty fish will draw you into its world the moment you put it in your mouth. The fish is cut thickly, so you can enjoy the luxurious texture of this dish. The grated radish on top will reset your mouth."

            {

                    en: "Pearls are the most famous jewels of the sea, but Ikura (salmon roe) is truly an eating jewel. The rich flavor of Ikura overflows when you bite into it, and you can't help but give it a standing ovation. Although it is a baby Appearance of Ikura, its presence is second to none."

                    en: "As the kanji for spring (春) is used in the name, this is the season for the warmer months of the year. Winter and spring have different fat content, but each has its own distinctive flavor. Please enjoy it with shining grated ginger as an accompaniment to the evening cherry blossoms."

            {

        function switchLanguage(lang) {
            currentLanguage = lang;
            
            // ボタンの状態を更新
            document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            // UIテキストを更新
            document.getElementById('main-title').textContent = uiTexts[lang].title;
            document.getElementById('footer-info').textContent = uiTexts[lang].footer;
            
            // 現在のすしだるまの説明を更新
            updateCurrentDaruma();
        }
        
        function updateCurrentDaruma() {
            const daruma = sushiDarumaData[currentIndex];
            document.getElementById('daruma-name').textContent = daruma.name[currentLanguage];
            document.getElementById('daruma-description').textContent = daruma.description[currentLanguage];
        }
        
        function updateSideDaruma() {
            const prevIndex = currentIndex === 0 ? sushiDarumaData.length - 1 : currentIndex - 1;
            const nextIndex = currentIndex === sushiDarumaData.length - 1 ? 0 : currentIndex + 1;
            
            document.getElementById('side-left-img').src = sushiDarumaData[prevIndex].image;
            document.getElementById('side-left-img').alt = sushiDarumaData[prevIndex].name[currentLanguage];
            
            document.getElementById('side-right-img').src = sushiDarumaData[nextIndex].image;
            document.getElementById('side-right-img').alt = sushiDarumaData[nextIndex].name[currentLanguage];
        }
        
        function updateDaruma() {
            const daruma = sushiDarumaData[currentIndex];
            const card = document.querySelector('.zukan-card');
            
            // フェードアウト
            card.style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('daruma-number').textContent = `No. ${currentIndex + 1}`;
                document.getElementById('daruma-name').textContent = daruma.name[currentLanguage];
                document.getElementById('daruma-description').textContent = daruma.description[currentLanguage];
                
                // 画像を更新
                const gifElement = document.getElementById('daruma-gif');
                gifElement.src = daruma.image;
                gifElement.alt = daruma.name[currentLanguage];
                
                // サイドのすしだるまも更新
                updateSideDaruma();
                
                // フェードイン
                card.style.opacity = '1';
            }, 300);
        }
        
        function nextDaruma() {
            currentIndex = (currentIndex + 1) % sushiDarumaData.length;
            updateDaruma();
            resetAutoSlide();
        }
        
        function previousDaruma() {
            currentIndex = currentIndex === 0 ? sushiDarumaData.length - 1 : currentIndex - 1;
            updateDaruma();
            resetAutoSlide();
        }
        
        function resetAutoSlide() {
            // 既存のタイマーをクリア
            clearInterval(autoSlideInterval);
            
            // プログレスバーをリセット
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.animation = 'none';
            
            // 少し待ってから再開
            setTimeout(() => {
                progressBar.style.animation = 'progress 7s linear infinite';
                autoSlideInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % sushiDarumaData.length;
                    updateDaruma();
                }, 7000);
            }, 50);
        }
        
        // 初期化
        function init() {
            updateSideDaruma();
            
            // 自動スライド開始
            autoSlideInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % sushiDarumaData.length;
                updateDaruma();
            }, 7000);
        }
        
        // 初期化実行
        init();
        
        // 右クリック禁止
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // ドラッグ禁止
        window.addEventListener('DOMContentLoaded', function() {
            var images = document.getElementsByTagName('img');
            for (var i = 0; i < images.length; i++) {
                images[i].addEventListener('mousedown', function(e) {
                    e.preventDefault();
                });
                images[i].addEventListener('dragstart', function(e) {
                    e.preventDefault();
                });
            }
        });
    </script>
