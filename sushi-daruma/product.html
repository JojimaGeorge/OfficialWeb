<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<title>商品詳細 | すしだるまショップ</title>
	<meta name="theme-color" content="#FFED4D">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="description" content="すしだるまオフィシャルグッズショップ">
	<link rel="icon" href="image/h_salmon.png" sizes="16x16" type="image/png" />
	<link rel="icon" href="image/h_salmon.png" sizes="32x32" type="image/png" />
	<link rel="icon" href="image/h_salmon.png" sizes="48x48" type="image/png" />
	<link rel="icon" href="image/h_salmon.png" sizes="62x62" type="image/png" />
	<link href="https://fonts.googleapis.com/css?family=M+PLUS+Rounded+1c" rel="stylesheet">
	<link href="sushidaruma.css" rel="stylesheet" type="text/css" />
	<link href="shop.css" rel="stylesheet" type="text/css" />
</head>
<body>

<!-- ナビゲーション -->
<div id="wrapper">
  <div class="btn-gnavi">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <nav id="global-navi">
    <ul class="menu">
      <li><a href="index.html"><img src="image/logo.png" class="logo" alt="すしだるまロゴ"></a></li>
	  <div class="letter">
		  <li><a href="index.html#top">TOP</a></li>
		  <li><a href="index.html#news">NEWS</a></li>
		  <li><a href="index.html#history">HISTORY</a></li>
		  <li><a href="index.html#NFT">NFT</a></li>
		  <li class="nav-shop-item">
		    <a href="shop.html" style="color: #e8637a;">SHOP</a>
		    <button id="cart-toggle" class="cart-toggle-nav" aria-label="カートを開く">
		      <svg viewBox="0 0 24 24" width="18" height="18" fill="#555050"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 14.26l.04-.12.94-1.7h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0020.04 4H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25z"/></svg>
		      <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
		    </button>
		  </li>
		  <li><a href="index.html#links">LINKS</a></li>
		  <li><a href="index.html#contact">CONTACT</a></li>
	  </div>
    </ul>
  </nav>
</div>

<!-- カートドロワー -->
<div id="cart-overlay" class="cart-overlay"></div>
<aside id="cart-drawer" class="cart-drawer">
  <div class="cart-drawer-header">
    <h2>カート</h2>
    <button id="cart-close" class="cart-close" aria-label="カートを閉じる">&times;</button>
  </div>
  <div id="cart-items" class="cart-items">
    <p class="cart-empty">カートは空です</p>
  </div>
  <div id="cart-footer" class="cart-footer" style="display:none;">
    <div class="cart-total">
      <span>合計</span>
      <span id="cart-total-price">¥0</span>
    </div>
    <p class="cart-note">※ 商品ごとに決済ページへ進みます</p>
  </div>
</aside>

<!-- カート追加モーダル -->
<div id="cart-modal-overlay" class="cart-modal-overlay">
  <div class="cart-modal">
    <div class="cart-modal-icon">
      <svg class="checkmark-svg" viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="23" fill="none" stroke="#48bb78" stroke-width="3"/>
        <path class="checkmark-check" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M15 27l7 7 15-15"/>
      </svg>
    </div>
    <p class="cart-modal-message">商品をカートに追加しました</p>
    <p class="cart-modal-product" id="cart-modal-product"></p>
    <div class="cart-modal-actions">
      <button type="button" id="cart-modal-view" class="cart-modal-btn cart-modal-btn-primary">カートを見る</button>
      <button type="button" id="cart-modal-continue" class="cart-modal-btn cart-modal-btn-secondary">お買い物を続ける</button>
    </div>
  </div>
</div>

<!-- 商品詳細 -->
<section class="product-detail-section">
  <div class="product-detail">

    <!-- 左：画像 -->
    <div class="product-detail-image" id="product-image">
      <!-- JSで挿入 -->
    </div>

    <!-- 右：情報 -->
    <div class="product-detail-info" id="product-info">
      <!-- JSで挿入 -->
    </div>

  </div>

  <div class="product-detail-back">
    <a href="shop.html">&larr; ショップに戻る</a>
  </div>
</section>

<!-- フッター -->
<footer>
  <div class="footer-content">
    <img src="image/footer.png" alt="フッター画像" class="footer-image">
    <p class="copyright">&copy; Jojima George</p>
  </div>
</footer>

<script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
<script type="text/javascript" src="shop.js"></script>

</body>
</html>
